[project]
name = "kinetic"
version = "0.1.0"
description = "Kinetic care team: a client-owned care team model with identity and access policy"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kinetic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
