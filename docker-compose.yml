services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: kinetic
      POSTGRES_PASSWORD: kinetic
      POSTGRES_DB: kinetic
    ports:
      # Host port 5433 so it does not clash with a locally installed Postgres on 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kinetic"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
